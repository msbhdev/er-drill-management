name: Deploy to staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, er-drill-staging]
    timeout-minutes: 15
    steps:
      - name: Run deploy script on VM
        run: bash /var/www/er-drill/scripts/deploy.sh
